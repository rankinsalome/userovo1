name: Build Tweak
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
